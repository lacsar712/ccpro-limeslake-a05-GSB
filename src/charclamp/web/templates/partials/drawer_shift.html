<aside class="drawer" role="dialog" aria-label="登记焖烧班次">
  <header class="drawer-head">
    <h2>登记焖烧班次</h2>
    <button type="button" class="icon-close" onclick="closeDrawer()" aria-label="关闭">×</button>
  </header>
  <form class="drawer-body" method="post" action="/shifts/new">
    <label>炭窑
      <select name="clamp_id" id="shift-clamp-select" required
              hx-on:change="document.getElementById('shift-expected-status').value = this.options[this.selectedIndex].dataset.status || ''">
        {% for clamp in clamps %}
        <option value="{{ clamp.id }}"
                data-status="{{ clamp.status }}"
                {% if preselect_clamp_id == clamp.id %}selected{% endif %}>{{ clamp.code }}（{{ status_labels.get(clamp.status, clamp.status) }}）</option>
        {% endfor %}
      </select>
    </label>
    {# 打开登记表时看到的窑态快照：并发第一班的乐观锁凭据，服务端据库复核 #}
    <input type="hidden" name="expected_status" id="shift-expected-status" value="{{ preselect_status }}" />
    <label>开始时间
      <input name="started_at" type="datetime-local" />
    </label>
    <label>峰值温度 ℃（可空）
      <input name="peak_temp_c" type="number" step="0.1" />
    </label>
    <label>炭品等级
      <input name="charcoal_grade" value="B" />
    </label>
    <label>备注
      <textarea name="notes" rows="3"></textarea>
    </label>
    <p class="hint">出炭要求最近班次峰值 ≥ 400℃；本表只登记班次。</p>
    <div class="actions">
      <button type="submit">写入时间轴</button>
      <button type="button" class="btn ghost" onclick="closeDrawer()">取消</button>
    </div>
  </form>
</aside>
