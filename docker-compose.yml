services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: charclamp
      POSTGRES_USER: charclamp
      POSTGRES_PASSWORD: charclamp
    ports:
      - "6550:5432"
    volumes:
      - charclamp_5150_6550_pg:/var/lib/postgresql/data
    # 首次 initdb 时频繁 healthcheck 会卡住临时库关停，故改为仅等容器启动
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U charclamp -d charclamp"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 30
    #   start_period: 40s

  web:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://charclamp:charclamp@db:5432/charclamp
      DATABASE_URL_SYNC: postgresql+psycopg2://charclamp:charclamp@db:5432/charclamp
      SECRET_KEY: charclamp-dev-secret
    ports:
      - "5150:8000"
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  charclamp_5150_6550_pg: